set timeout=3
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat

# If the hard drive already holds a finished BocaBell install, boot that
# instead of reinstalling. The marker is written at the end of a successful install.
if search --no-floppy --file --set=bocadone /var/lib/bocabell-installed; then
    menuentry "BocaBell is installed - boot it from the hard drive" {
        search --no-floppy --file --set=root /var/lib/bocabell-installed
        set prefix=($root)/boot/grub
        configfile /boot/grub/grub.cfg
    }
fi

# autoinstall = no confirmation screen; noprompt = no "remove the installation medium" prompt.
menuentry "BocaBell unattended install (ERASES THE HARD DRIVE)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz autoinstall noprompt ---
    initrd /casper/initrd
}
